name: Release

# Publishes a GitHub Release with the production build when a version tag is pushed:
#   git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test

      - name: Set package version from tag
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Build
        run: bun run build
        env:
          NODE_ENV: production

      - name: Package
        run: |
          mv dist graphhound
          tar -czf graphhound-${GITHUB_REF_NAME}.tar.gz graphhound
          zip -qr graphhound-${GITHUB_REF_NAME}.zip graphhound
          sha256sum graphhound-${GITHUB_REF_NAME}.* > SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            graphhound-${{ github.ref_name }}.tar.gz
            graphhound-${{ github.ref_name }}.zip
            SHA256SUMS.txt
